name: build-dir882-lzma

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          df -h

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools python3-distutils rsync unzip zlib1g-dev file wget swig

      - name: Clone OpenWrt 24.10
        run: |
          git clone --depth 1 -b openwrt-24.10 https://github.com/openwrt/openwrt.git owrt

      - name: Patch dir-882-a1 to use lzma-loader
        run: |
          cd owrt
          f=target/linux/ramips/image/mt7621.mk
          awk '
          /define Device\/dlink_dir-882-a1/ { inblk=1 }
          inblk && /^endef/ { print "  $(Device/uimage-lzma-loader)"; inblk=0 }
          { print }
          ' "$f" > "$f.new" && mv "$f.new" "$f"
          echo "==== recipe ===="
          grep -n -A 25 'define Device/dlink_dir-882-a1' "$f"

      - name: Patch flash layout to firmware @ 0x50000 (match Breed)
        run: |
          cd owrt
          g=target/linux/ramips/dts/mt7621_dlink_flash-16m-a1.dtsi
          sed -i 's/reg = <0x40000 0x20000>;/reg = <0x40000 0x10000>;/' "$g"
          sed -i 's/partition@60000 {/partition@50000 {/' "$g"
          sed -i 's/reg = <0x60000 0xfa0000>;/reg = <0x50000 0xfb0000>;/' "$g"
          echo "==== patched flash layout (firmware must be 0x50000) ===="
          grep -n -E 'partition@|label|reg = <0x' "$g"

      - name: Bake default LAN IP 192.168.199.1
        run: |
          cd owrt
          mkdir -p files/etc/uci-defaults
          cat > files/etc/uci-defaults/99-set-lan-ip <<'EOF'
          uci -q set network.lan.ipaddr='192.168.199.1'
          uci -q commit network
          exit 0
          EOF
          echo "==== baked uci-defaults/99-set-lan-ip ===="
          cat files/etc/uci-defaults/99-set-lan-ip

      - name: Enable pstore/ramoops in kernel (diagnostic)
        run: |
          cd owrt
          k=target/linux/ramips/mt7621/config-6.6
          test -f "$k" || { echo "MISSING $k"; ls target/linux/ramips/mt7621/; exit 1; }
          sed -i '/CONFIG_PSTORE/d' "$k"
          cat >> "$k" <<'EOF'
          CONFIG_PSTORE=y
          CONFIG_PSTORE_RAM=y
          CONFIG_PSTORE_CONSOLE=y
          CONFIG_PSTORE_PMSG=y
          EOF
          echo "==== kernel config tail ===="
          tail -8 "$k"

      - name: Add ramoops reserved-memory to DIR-882 DTS (diagnostic)
        run: |
          cd owrt
          d=target/linux/ramips/dts/mt7621_dlink_dir-882-a1.dts
          test -f "$d" || { echo "MISSING $d"; ls target/linux/ramips/dts/; exit 1; }
          cat >> "$d" <<'EOF'

          / {
          reserved-memory {
          #address-cells = <1>;
          #size-cells = <1>;
          ranges;
          ramoops@7e00000 {
          compatible = "ramoops";
          reg = <0x07e00000 0x100000>;
          record-size = <0x8000>;
          console-size = <0x8000>;
          pmsg-size = <0x8000>;
          };
          };
          };
          EOF
          echo "==== dts tail ===="
          tail -20 "$d"

      - name: Update & install feeds
        run: |
          cd owrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure (.config) + ccache
        run: |
          cd owrt
          cat > .config <<'EOF'
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7621=y
          CONFIG_TARGET_ramips_mt7621_DEVICE_dlink_dir-882-a1=y
          CONFIG_TARGET_ROOTFS_INITRAMFS=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_CCACHE=y
          EOF
          make defconfig

      - name: Cache downloads (dl/)
        uses: actions/cache@v4
        with:
          path: owrt/dl
          key: owrt-dl-2410-${{ hashFiles('owrt/.config') }}
          restore-keys: |
            owrt-dl-2410-

      - name: Cache ccache (.ccache)
        uses: actions/cache@v4
        with:
          path: owrt/.ccache
          key: owrt-ccache-2410-${{ github.run_id }}
          restore-keys: |
            owrt-ccache-2410-

      - name: Download sources
        run: |
          cd owrt
          make download -j8 || make download -j1 V=s

      - name: Build
        run: |
          cd owrt
          make -j$(nproc) || make -j1 V=s

      - name: Collect images
        run: |
          cd owrt
          mkdir -p ../out
          cp -v bin/targets/ramips/mt7621/*dir-882-a1*initramfs*.bin ../out/ || true
          cp -v bin/targets/ramips/mt7621/*dir-882-a1*sysupgrade.bin ../out/ || true
          echo "==== artifacts ===="
          ls -la ../out

      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: dir882-ramoops-0x50000
          path: out/*
          if-no-files-found: error
